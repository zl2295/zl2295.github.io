# baseURL: https://example.org/
# locale: en-us
# title: My New Hugo Project
# theme: ["PaperMod"]

baseURL: "https://zl2295.github.io/"
languageCode: en-us
title: "Zhikun Lu"
theme: PaperMod

pagination:
  pagerSize: 10

enableRobotsTXT: true
outputs:
  home: [HTML, RSS, JSON]   # JSON needed for search

params:
  env: production
  defaultTheme: auto
  ShowReadingTime: true
  ShowCodeCopyButtons: true
  ShowPostNavLinks: true
  ShowToc: true
  math: true                # used by the KaTeX partial below

  homeInfoParams:
    Title: "AI for Business"
    Content: "Research and teaching notes on causal inference, machine learning,
    and business decision-making by [Zhikun Lu](https://www.zhikun.lu), NYU Shanghai."

  socialIcons:
    - name: github
      url: "https://github.com/luzk-emory"
    - name: googlescholar
      url: "https://scholar.google.com/citations?user=GTBayGYAAAAJ&hl=en"

menu:
  main:
    - { name: Posts, url: /posts/, weight: 10 }
    - { name: Tags, url: /tags/, weight: 20 }
    - { name: Search, url: /search/, weight: 30 }

markup:
  goldmark:
    renderer:
      unsafe: true
    extensions:
      passthrough:
        enable: true
        delimiters:
          block: [['\[', '\]'], ['$$', '$$']]
          inline: [['\(', '\)'], ['$', '$']]

caches:
  images:
    dir: :cacheDir/images