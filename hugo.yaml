baseURL: "https://zl2295.github.io/"
languageCode: en-us
title: "AI for Business"
theme: PaperMod

pagination:
  pagerSize: 10

enableRobotsTXT: true
outputs:
  home: [HTML, RSS, JSON]   # JSON needed for search

params:
  env: production
  defaultTheme: auto
  ShowReadingTime: true
  ShowCodeCopyButtons: true
  ShowPostNavLinks: true
  ShowToc: true
  math: true                # used by the KaTeX partial below

  homeInfoParams:
    Title: "Hi there, this site contains a series of blog posts for research and teaching in AI for Business, by Zhikun Lu from NYU Shanghai"
    Content: "Notes on causal inference, operations, and AI for business."

  socialIcons:
    - name: github
      url: "https://github.com/<username>"
    - name: googlescholar
      url: "https://scholar.google.com/..."

menu:
  main:
    - { name: Posts, url: /posts/, weight: 10 }
    - { name: Tags, url: /tags/, weight: 20 }
    - { name: Search, url: /search/, weight: 30 }

markup:
  goldmark:
    renderer:
      unsafe: true
    extensions:
      passthrough:
        enable: true
        delimiters:
          block: [['\[', '\]'], ['$$', '$$']]
          inline: [['\(', '\)'], ['$', '$']]

caches:
  images:
    dir: :cacheDir/images